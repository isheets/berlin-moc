# What is compared, on which day, and with which inputs.

scenario:
  service_day: 2026-10-06          # a Tuesday in school term
  gtfs: vbb
  osm: osm-berlin-2026-01-01
  ten_minute:                      # every line of these modes runs at least every `max_gap_min`
    agency: "796"                  # Berliner Verkehrsbetriebe
    modes: [bus, tram]
    hours: [6, 21]                 # weekday peak and off-peak hours, local transport plan 2019-2023
    max_gap_min: 10
    min_trips: 15                  # a trip pattern with fewer in those hours is not regular service
  coverage:                        # the local transport plan's measure of the 10-minute network
    hours: [9, 14]                 # weekday off-peak
    radius_m: {dense: 400, other: 500}
    dense_per_ha: 70               # 7,000 residents per km²
  sentinel:                        # fewer than 6 departures an hour today, at least 6 in the scenario
    stop: Bruno-Bürgel-Weg (Berlin)
    line: "165"
    hour: 10

groups:                            # care trips of adults living with children, against all commutes
  care:                            # a care activity at either end: Dianin et al. (2026)
    label: Care trips
    description: Car-driver trips by adults living with children to or from a drop-off, pick-up or daily shopping
    trips: data/matsim-trips-care.csv
    matsim: {ages: [18, null], mode: car_driver, household: multi_w_children,
             either_end: [transport, shop_daily]}
  commute:
    label: Commutes by car
    description: Home-to-work car-driver trips by adults
    trips: data/matsim-trips-commute.csv
    matsim: {ages: [18, null], mode: car_driver, from: home, to: work}

parameters:
  sample_share: 0.25               # the MATSim population is a 25% sample of residents
  min_straight_line_km: 0.5        # shorter trips are dropped
  walk_speed_kmh: 4.82             # everyone; all-ages reference, 1.34 m/s, Bosina & Weidmann
                                   # (2017) Table 12. Under-10s average 0.88 m/s (3.17 km/h)
  car_ends:                        # time a car trip spends at either end, besides the drive
    curbside_dwell_min: 1.0        # per drop-off or pick-up: 59.8 s, von Bartheld (2011)
    escort:                        # each drop-off or pick-up stop is curbside or parked
      activity: transport
      curbside_share: 0.44         # SrV 2018 Tab 5.1.4 (Gerike et al. 2019): the driver goes in for
                                   # Kita 49.0%, doctor or public office 3.6%, services 1.0%; the rest
                                   # is curbside; "other" 4.0% split in proportion
    parked:                        # first match on the activity at the end: mean search on arrival
                                   # and walk to the door over all trips, start2park (Hagen & Saki
                                   # 2023, Tables 5 and 17), recorded mostly in Frankfurt
      - {activities: [home], search_min: 1.60, walk_m: 113}           # trip home, 01:36
      - {activities: ["shop_*"], search_min: 1.23, walk_m: 71}        # shopping, 01:14
      - {activities: [work], search_min: 1.45, walk_m: 124}           # work, 01:27; no employer space
      - {activities: [work_business], search_min: 1.52, walk_m: 81}   # business, 01:31
      - {activities: [leisure, dining, outside_recreation], search_min: 1.45, walk_m: 101}   # 01:27
      - {activities: ["*"], search_min: 1.42, walk_m: 96}             # all trips, 01:25
    home_street_share: {inner: 0.70, outer: 0.49}   # cars kept on the street at home, "varies"
                                   # counted half; the rest park privately at no cost. SrV 2023
                                   # Tab 4.2 (Hubrich et al. 2025), inner and outer city reports
  departure_window_min: 60         # how far past the departure time PT itineraries are searched
  max_rides: 5                     # set above what any itinerary uses, so it never binds
  min_change_min: 1                # a trip whose PT time moves by less is "unaffected"
  min_area_trips: 10               # fewer trips from a home area: counted, not summarized
  ratio_bands: [1.5, 2.5, 3.5]     # Lunke et al. (2021): PT's share of commutes falls band by band
  typical_window: 0.05             # a typical trip is within this percentile rank of its group's
                                   # median on driving distance, ratio and walking share
  driving_km_bands: [2, 4, 6, 8, 10, 15, 20]   # edges of the driving-distance breakdowns
  trip_lines_share: 0.05           # trips the page draws as straight lines: this share of each
                                   # group's trips, sampled within each district
  routing_threads: 4

