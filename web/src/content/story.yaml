# Everything the story says, in the order it says it. Edit freely: the page reloads on save.
#
# In any text:
#   {care.ratio|per10}   a number from the data, with a format (see src/lib/text.js for both lists)
#   [cite:lunke2021]     a citation, numbered by first use, opening the Sources drawer
#   **bold**, *italic*, [link text](https://...)
#
# The story is a list of steps. In each, the map tells the finding and the card says how to read
# it: a headline (the claim), one line of text (what to look at, what to try), the step's key (its
# control and legend, src/keys/, worded under `keys`), and details behind "More".
#   label:  the stretch of the story it belongs to (the progress bar, the kicker)
#   map:    a map state (src/map/states.js), drawn for the reader's view
#   view:   where the step's control starts (src/lib/view.svelte.js)

title: The mobility of care in Berlin

intro:
  kicker: The mobility of care in Berlin
  headline: Care trips outnumber commutes, and take twice as long by public transport as by car
  lead: >
    Drop-offs, pick-ups, and daily shopping, for households with children in Berlin: the mobility
    of care [cite:sanchez2013].
  lines:
    - step: common
      text: More of them than work commutes, and more of them driven.
    - step: slow
      text: Twice as long by public transport as by car.
    - step: distance
      text: They're short, and on half of them walking is most of the trip.
    - step: whatif
      text: A bus every 10 minutes changes little, a bit more for care trips.
  byline: Isaac Sheets · October 2026
  start: Start
  links:
    - label: Explore the map
      explore: true
    - label: Code
      href: https://github.com/
  map: hero

steps:
  - id: common
    label: How common?
    headline: >
      For [households with children](term:households) in Berlin, [care trips](term:care)
      outnumber [work commutes](term:commutes) and are more car-dependent
    text: >
      Walking and cycling already carry more of them. It's the driven ones,
      {care.car_trips|thousand} a weekday, that public transport could take.
    key: modes
    map: modes

  - id: slow
    label: How much longer?
    headline: Twice as long by public transport [as by car](term:timed)
    text: >
      Every 10 minutes by car become {care.ratio|per10} by public transport, more in the [outer
      districts](term:place).
    key: ratio
    map: ratio

  - id: distance
    label: Why?
    headline: Shorter trips, not worse service
    text: >
      Care trips are [short](term:short), commutes long. At the same distance, the two fare the
      same against the car.
    key: distance
    map: distance

  - id: walking
    label: Why?
    headline: On a short trip, walking is most of it
    text: >
      The walk to and from the stops takes about as long on any trip, so the shorter the trip, the
      more of it is walking. Half of care trips are under 4 km.
    key: walking
    map: walking

  - id: whatif
    label: What if?
    headline: The [10-minute goal](term:network) changes little, a bit more for care trips
    text: >
      The gain is small, but in most areas care trips gain a larger share of their time than
      commutes.
    key: gap
    map: whatif

  - id: close
    label: So what?
    headline: Closer, not only more often
    text: >
      To compete for care trips, public transport has to come [closer](term:closer) to where they
      start and end.
    map: hero

# Definitions the reader can open from the text: [label](term:id). Keep them to a sentence or
# two; they are the story's fine print.
terms:
  households: >
    The residents of MATSim Open Berlin [cite:matsim], a synthetic population: each lives a real
    respondent's day from Berlin's 2018 travel survey, so together they travel as Berliners do,
    though none is a real person. Here, the adults in households with children, and their trips
    over 500 m with both ends in Berlin.
  care: >
    A trip to or from a drop-off, a pick-up, or daily shopping, by any mode [cite:dianin2026].
    Errands and visits are left out: the data can't tell a household's from a person's own.
  commutes: >
    A trip to or from work with no care destination at either end. Work to a daycare counts as a
    care trip.
  timed: >
    Every care trip and every drive from home to work made by car today, timed again door to door
    at the hour it was made: by car, with simulated congestion and parking, and by public
    transport on the 2026 timetable [cite:vbb], waiting included. From here on, a commute is such
    a drive, by any adult.
  place: >
    At the same distance and from the same district, care trips and commutes fare alike: the map
    shows where people live, not why they travel.
  short: >
    A typical care trip is a {care.km|dec1} km drive, a typical commute {commute.km|dec1} km.
  walking: >
    When walking takes more than half the trip's time by public transport: to the stop, between
    stops, and from the last one. Everyone here walks at an adult's pace; with a child or bags of
    groceries, it's slower.
  network: >
    A bus or tram at least every 10 minutes from 6:00 to 21:00 on every BVG line: a goal of
    Berlin's 2019 local transport plan [cite:nvp], deferred until after 2028. Tested here by
    adding trips wherever a line leaves a longer gap.
  saved: >
    The minutes the 10-minute network saves, as a share of the trip's time by public transport
    today. An area needs {minimum.gap|int} care trips and {minimum.gap|int} commutes to compare.
  closer: >
    An implication, not a tested scenario. And time is only part of it: escorting people and
    carrying things aren't measured here.

# Each step's key: its control and legend.
keys:
  modes:
    title: Trips over 500 m by mode
    groups: { care: Care trips, commute: Work commutes }
    perWeekday: / weekday
    modes: { pt: Public transport, car: Car, other: Active modes }
    per: 10000
    unit: "Each square: 10,000 trips a weekday. On the map, each dot: {dots.modes|int}."
  ratio:
    title: Public transport ÷ car time, median by where trips start
    groups: { care: Care trips, commute: Commutes }
    noData: Too few trips (n < {minimum.statistics|int})
    within: Public transport within 1.5× the car
    of: { care: of care trips, commute: of commutes }
    unit: 1 dot = {dots.within|int} trips a weekday
    lunke: >
      Where public transport takes under 1.5 times as long, it carries 20% or more of commuters
      who could drive; beyond 3.5 times, under 5% [cite:lunke2021].
  distance:
    title: Each group's trips by driving distance
    groups: { care: Care trips, commute: Commutes }
    all: All distances
    km: km
    under: Under
    orMore: or more
    readoutAll: "Public transport ÷ car, median: all distances"
    readout: "Public transport ÷ car, median:"
  walking:
    title: Trips [mostly walking](term:walking) by public transport, by driving distance
    groups: { care: Care trips, commute: Commutes }
    all: All distances
    km: km
    under: Under
    orMore: or more
    unit: "On the map: [mark:walk_most] mostly walking, [mark:walk_less] the rest"
  gap:
    title: "[Share of their time](term:saved) the network saves: care trips minus commutes, by area"
    careMore: Care trips save more
    commuteMore: Commutes save more
    berlin: City-wide
    noData: Too few trips to compare (n < {minimum.gap|int})
    compare: >
      Saved on average: **{care.saved_share|pct1}** of a care trip's time by public transport,
      {commute.saved_share|pct1} of a commute's. {care.faster|pct} of care trips get faster,
      {commute.faster|pct} of commutes.

# The tooltip over a planning area.
tooltip:
  carMinutes: 10 min by car
  becomes: become
  byPt: by public transport
  median: Median trip
  trips: { care: care trips, commute: commutes }
  few: Too few trips
  saved: saved per trip, on average
  savedShare: Time saved
  ofCare: of care trips' time
  ofCommutes: of commutes'

# Where the story hands over: the button that replaces Next on the last step, and explore mode.
explore:
  label: Explore the map
  text: Your area, by hour, by child poverty, and the method in full.
  back: Back to the story
  map: ratio

# For explore mode's 10-minute network card (stage D): cut from the story, kept for there.
network_card:
  coverage: >
    It would put {scenario.covered_10|pct} of Berliners near a line every 10 minutes, up from
    {scenario.covered|pct}, measured as the plan does: living within 400 m of such a stop in dense
    areas, 500 m elsewhere, weekday off-peak.

# For the detailed method view in explore mode (stage D).
method:
  limits:
    - The trips are synthetic.
    - "Only trips driven today are timed: this shows how far public transport is from competing, not how many drivers would switch."
    - Everyone walks at an adult's pace.

ui:
  next: Next
  back: Back
  sources: Sources and data

sources:
  - id: sanchez2013
    text: >
      Sánchez de Madariaga, I. (2013). Mobility of care: Introducing new concepts in urban
      transport. In I. Sánchez de Madariaga & M. Roberts (Eds.), *Fair Shared Cities: The Impact of
      Gender Planning in Europe* (pp. 33–48). Ashgate.
    url: https://www.taylorfrancis.com/chapters/edit/10.4324/9781315581835-4/mobility-care-introducing-new-concepts-urban-transport-in%C3%A9s-s%C3%A1nchez-de-madariaga
  - id: matsim
    text: MATSim Open Berlin scenario, v7.0. Transport Systems Planning and Telematics (VSP), TU Berlin.
    url: https://github.com/matsim-scenarios/matsim-berlin/tree/v7.0
  - id: dianin2026
    text: >
      Dianin, A., Ceccato, R. & Diana, M. (2026). Mobility of care in daily trip chaining: An
      exploratory analysis in Turin, Italy. *Journal of Urban Mobility* 9, 100208.
  - id: vbb
    text: VBB Verkehrsverbund Berlin-Brandenburg. GTFS timetable, published 29 September 2026.
    url: https://unternehmen.vbb.de/digitale-services/datensaetze/
  - id: lunke2021
    text: >
      Lunke, E. B., Fearnley, N. & Aarhaug, J. (2021). Public transport competitiveness vs. the
      car: Impact of relative journey time and service attributes. *Research in Transportation
      Economics* 90, 101098.
    url: https://doi.org/10.1016/j.retrec.2021.101098
  - id: nvp
    text: >
      Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt. *Nahverkehrsplan Berlin
      2019–2023*, and the draft *Nahverkehrsplan 2026–2028*.
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/oeffentlicher-personennahverkehr/nahverkehrsplan/

