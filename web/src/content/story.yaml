# Everything the story says, in the order it says it. Edit freely: the page reloads on save.
#
# In any text:
#   {care.ratio|per10}   a number from the data, with a format (see src/lib/text.js for both lists)
#   [cite:lunke2021]     a citation, numbered by first use, opening the Sources drawer
#   **bold**, *italic*, [link text](https://...)
#
# The story is the intro, then a list of steps, one at a time in one card under the title. In each
# step, the map tells the finding and the card asks and answers it: the question, the answer, the
# step's key (its control and legend, src/keys/, worded under `keys`), a caption under the key, and
# a note at the foot of the card.
#   label:     the question (the progress bar, the intro's list, the close's recap); it can hold
#              terms
#   headline:  the answer
#   text:      the caption: one short sentence on what the key and the map show
#   note:      the footnote: what is counted, and what a square or a dot stands for
#   key:       the step's key (src/story/Card.svelte)
#   map:       a map state (src/map/states.js), drawn for the reader's view
#   view:      where the step's control starts (src/lib/view.svelte.js)
#   recap:     true lists every step before it, question and answer, under its answer (the close,
#              a discussion: its label asks no question, so the intro's list leaves it out)
#   explainer: true gives the step's key the button that opens the explainer (worded under
#              `explainer`)

title: Mobility of care in Berlin

intro:
  label: Overview
  headline: "[Care trips](color:care) and [commutes](color:commute)"
  lead: >
    Drop-offs, pick-ups, and the daily shop make up the mobility of care: travel for the unpaid
    work of looking after others and the household[cite:sanchez2013].

    How well does public transport serve these trips, compared with the commute? This study times
    both by public transport and by car, for Berlin households with children.

    Five questions, answered with a [synthetic population](term:synthetic_population) from MATSim
    Open Berlin[cite:matsim].
  contents: Five questions
  byline: "[Isaac Sheets](term:author) · October 2026"
  start: Start
  links:
    - label: Code
      href: https://github.com/isheets/berlin-moc
  map: intro

steps:
  - id: common
    label: How common are [care trips](term:care), and how do people make them?
    headline: More common than [commutes](term:commutes), and more often driven.
    text: >
      The rest of the story follows the driven trips, where public transport competes with the car.
    note: Trips over 500 m, by adults in households with children.
    key: modes
    map: modes

  - id: slow
    label: How [competitive](term:competitive) is public transport for care trips?
    headline: Slightly less than for commutes.
    note: >
      Based on a [simulation](term:timed) of {trips|thousand} trips by a {scenario.sample|pct}
      sample of residents: {care.trips|thousand} care trips and {commute.trips|thousand} commutes.
      The map shows where the model's trips start, not how each area's residents travel.
    key: ratio
    map: ratio
    explainer: true

  - id: distance
    label: Where does the gap with commutes come from?
    headline: >
      Care trips are [shorter than commutes](term:short), and short trips are where public
      transport loses most.
    text: >
      At the same distance the gap nearly closes. It's a [composition effect](term:composition).
    key: distance
    map: distance
    view: { band: 0 }

  - id: walking
    label: What slows public transport down for care trips?
    headline: >
      [Walking](term:walk). On half of care trips with public transport, the walking alone takes as
      long as the whole drive.
    text: >
      On those trips, public transport would still lose with no wait and a ride at the speed of
      light.
    note: The map shows where the model's trips start, not how each area's residents travel.
    key: walking
    map: walking

  - id: whatif
    label: What would a [bus or tram every 10 minutes](term:network) change?
    headline: Meeting this proposed headway standard would speed up trips only by a small amount, for care trips and commutes alike.
    text: >
      Most trips change by less than a minute. Those it speeds up save about
      {care.saved_when_faster|min} minutes.
    note: The map shows where the model's trips start, not how each area's residents travel.
    key: faster
    map: whatif

  - id: close
    label: Overall
    headline: >
      Public transport is less competitive for care trips mainly because they are shorter than
      commutes. 
      
      A bus or tram every 10 minutes would change little, for care trips and commutes alike.
    recap: true
    map: hero

# Definitions the reader can open from the text: [label](term:id). Keep them to a sentence or
# two; they are the story's fine print. A definition can also be {title, text, head, rows, note}:
# a title in place of the label, a text or a list of paragraphs, a table of rows ([label, value])
# with an optional head, and a note after it.
terms:
  # The byline's name opens the address, as text to copy and as a mailto link, then LinkedIn.
  author:
    text:
      - "Want to get in touch? Send me an email or connect on LinkedIn."
      - "[isaac.c.sheets@gmail.com](mailto:isaac.c.sheets@gmail.com)"
      - "[LinkedIn](https://www.linkedin.com/in/isaacsheets1/)"
  synthetic_population: >
    Each resident makes similar trips to those of a real respondent reported in Berlin's travel survey, with
    the same purposes, modes and times. But a model picks the places: a home can be anywhere in the 
    city and each stop is placed at about the reported distance.

    The findings hold for Berlin as a whole, but not for any one trip or area.
  care: >
    A trip to or from a drop-off, a pick-up, or daily shopping, by any mode [cite:dianin2026].
    
    Errands and visits are not considered, since the data can't tell household errands from
    personal ones.
  commutes: >
    A trip to or from work with no care destination at either end. 
    
    For example: work to a daycare counts as a care trip, but work to recreation counts as a commute.
  timed: >
    Each driven trip in the dataset, simulated door to door at a fixed departure time. 
    
    By public transport on the 2026 timetable [cite:vbb], walking and waiting included.
    
    By car, with simulated traffic and the time to park [cite:hagen2023] [cite:hubrich2025].
  competitive:
    title: Competitiveness
    text: >
      The ratio of public transport's door-to-door travel time to the car's, for the same trip and
      departure time: the closer to 1×, the more competitive.
  choice:
    title: Who chooses public transport
    text: "Among commuters who could drive, in Norwegian cities outside Oslo [cite:lunke2021]:"
    head: [Public transport vs. car, Chose public transport]
    rows:
      - [Under 1.5×, 20% or more]
      - [1.5–2.5×, 15–20%]
      - [2.5–3.5×, 5–15%]
      - [3.5× or more, Under 5%]
  short: >
    A typical care trip is a {care.km|dec1} km drive, a typical commute {commute.km|dec1} km.
  composition:
    title: Composition effect
    text: >
      A gap that comes from the mix of trips, not from how each kind is served. Public transport is
      least competitive on short trips, and half of care trips are under 4 km, so care trips come
      out worse overall. Distance for distance, the two are within about 0.1×.
  walk: >
    All the walking on a public transport trip: to the stop, between lines, and to the door.

    Adult's pace is assumed for the simulation. This understates the walk time for trips
    with children or heavy bags.
  network: >
    A bus or tram at least every 10 minutes from 6:00 to 21:00 on every BVG line. Originally proposed as a goal of
    the 2019 local transport plan [cite:nvp], deferred until after 2028. 
    
    Modeled here by adding trips to the GTFS timetable ensuring all lines meet the 10-minute headway maximum and re-running the simulation.

# Each step's key: its control and legend. What a square or a dot stands for goes in the step's
# note, not here.
keys:
  modes:
    groups: { care: Care trips, commute: Commutes }
    perWeekday: / weekday
    modes: { pt: Public transport, car: Driving, other: Active and other modes }
    square: "{squares.modes|int} trips / weekday"
    dot: "{dots.modes|int} trips / weekday  (map)"
  ratio:
    title: More competitive, by the area trips start in
    groups: { care: Care trips, commute: Commutes }
    medians: Median trip, public transport vs. car
    explain: What is this?
    careMore: For care trips
    commuteMore: For commutes
    even: Even, within 0.1×
    berlin: City-wide
    noData: Too few trips to compare (n < {minimum|int})
  distance:
    groups: { care: Share of care trips, commute: Share of commutes }
    markers: { care: Care trips, commute: Commutes }   # the medians on the ramp
    all: All distances
    km: km
    under: Under
    orMore: or more
    readoutAll: "Median public transport vs. car time, all distances"
    readout: "Median public transport vs. car time,"
    dot: "{dots.distance|int} trips / weekday"
  walking:
    groups: { care: Care trips, commute: Commutes }
    perWeekday: / weekday
    categories: { walk_longer: Walk as long as the whole drive, rest: The rest }
    map: Share by the area trips start in
    noData: Too few trips to show (n < {minimum|int})
  faster:
    groups: { care: Care trips, commute: Commutes }
    perWeekday: / weekday
    # {minutes}: the minutes the reader picks there (config.yaml's faster_by_min).
    categories: { faster: "Faster by {minutes} or more", rest: "Less, or no change" }
    map: Share by the area trips start in
    noData: Too few trips to show (n < {minimum|int})

# Step 2's side quest (src/story/Explainer.svelte), a drawer beside the card, from the button by the
# medians: what public transport competitiveness is, through one care trip the reader runs stage by
# stage on the map. The trip is a typical care trip picked by hand (src/lib/data.js EXAMPLE_TRIP):
# it runs from top left to bottom right, Mitte to Kreuzberg, and its ratio shows as the median's.
explainer:
  title: What is public transport competitiveness?
  close: Close
  lead: >
    Public transport's door-to-door time as a multiple of the car's, for the same trip.
  example: >
    Here's an example using a typical care trip from the dataset. It leaves {example.from} at {example.departure|clock}
    for {example.to}.
  car: Car                   # the travelers on the map
  pt: Public transport
  min: min
  stages:
    car:
      title: Simulate by car
      run: Drive it
      again: Drive it again
      parts: { walk: walking, park: finding a parking space, drive: driving }
    pt:
      title: Simulate by public transport
      run: Take public transport
      again: Take it again
      parts: { walk: walking, wait: waiting, ride: riding }
  # What each traveler is doing, on the map; {stop} and {line} are the trip's own, {minutes} its
  # minutes door to door.
  status:
    walkToCar: Walking to the car
    drive: Driving
    park: Finding a space
    walkToStop: "Walking to {stop}"
    wait: "Waiting for the {line}"
    ride: "On the {line}"
    change: "Changing to the {line}"
    walkToDoor: Walking to the door
    there: "Arrives in {minutes} min"
  compare:
    title: Compare the times
    over: Public transport vs. car
    same: Same time
    slower: Public transport slower
    thisTrip: This trip
    text: >
      Why it matters: a [study in Norway](term:choice) found that among commuters who could drive,
      the more competitive public transport is, the more people choose to take it.
  done: Got it

# The tooltip over a planning area.
tooltip:
  trips: { care: care trips, commute: commutes }
  few: Too few trips
  careTrips: Care trips
  commutes: commutes
  medianRatio: "Median trip, public transport vs. car"
  of: of
  shares:                    # what a share map's percentage counts
    walkShare: The walk takes as long as the whole trip by car
    fasterShare: "Faster by {minutes} or more with a bus or tram every 10 minutes"

ui:
  next: Next
  back: Back
  sources: Sources
  keys: to navigate              # after the arrow keys, on the intro's footer

sources:
  - id: sanchez2013
    text: >
      Sánchez de Madariaga, I. (2013). Mobility of care: Introducing new concepts in urban
      transport. In I. Sánchez de Madariaga & M. Roberts (Eds.), *Fair Shared Cities: The Impact of
      Gender Planning in Europe* (pp. 33–48). Ashgate.
    url: https://www.taylorfrancis.com/chapters/edit/10.4324/9781315581835-4/mobility-care-introducing-new-concepts-urban-transport-in%C3%A9s-s%C3%A1nchez-de-madariaga
  - id: matsim
    text: MATSim Open Berlin scenario, v7.0. Transport Systems Planning and Telematics (VSP), TU Berlin.
    url: https://github.com/matsim-scenarios/matsim-berlin/tree/v7.0
  - id: dianin2026
    text: >
      Dianin, A., Ceccato, R. & Diana, M. (2026). Mobility of care in daily trip chaining: An
      exploratory analysis in Turin, Italy. *Journal of Urban Mobility* 9, 100208.
  - id: vbb
    text: VBB Verkehrsverbund Berlin-Brandenburg. GTFS timetable, published 29 September 2026.
    url: https://unternehmen.vbb.de/digitale-services/datensaetze/
  - id: hagen2023
    text: >
      Hagen, T. & Saki, S. (2023). *start2park – Parksuche erfassen, verstehen und prognostizieren:
      Endergebnisse* (measuring, understanding and predicting the search for parking: final
      results). Frankfurt University of Applied Sciences.
    url: https://fhffm.bsz-bw.de/frontdoor/index/index/docId/6911
  - id: hubrich2025
    text: >
      Hubrich, S., Wittig, S., Ließke, F., Wittwer, R. & Gerike, R. (2025). *Mobilität in Städten –
      SrV 2023* (Berlin's household travel survey): table reports for the inner and outer city.
      TU Dresden.
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsdaten/zahlen-und-fakten/mobilitaet-in-staedten-srv-2023/
  - id: lunke2021
    text: >
      Lunke, E. B., Fearnley, N. & Aarhaug, J. (2021). Public transport competitiveness vs. the
      car: Impact of relative journey time and service attributes. *Research in Transportation
      Economics* 90, 101098.
    url: https://doi.org/10.1016/j.retrec.2021.101098
  - id: nvp
    text: >
      Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt. *Nahverkehrsplan Berlin
      2019–2023*, and the draft *Nahverkehrsplan 2026–2028*.
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/oeffentlicher-personennahverkehr/nahverkehrsplan/

