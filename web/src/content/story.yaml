# Everything the story says, in the order it says it. Edit freely: the page reloads on save.
#
# In any text:
#   {care.ratio|per10}   a number from the data, with a format (see src/lib/text.js for both lists)
#   [cite:lunke2021]     a citation, numbered by first use, opening the Sources drawer
#   **bold**, *italic*, [link text](https://...)
#
# The story is a list of steps. In each, the map tells the finding and the card says how to read
# it: a headline (the claim), one line of text (what to look at, what to try), the step's key (its
# control and legend, src/keys/, worded under `keys`), and details behind "More".
#   label:  the stretch of the story it belongs to (the progress bar, the kicker)
#   map:    a map state (src/map/states.js), drawn for the reader's view
#   view:   where the step's control starts (src/lib/view.svelte.js)

title: The mobility of care in Berlin

intro:
  kicker: The mobility of care in Berlin
  headline: Care trips outnumber commutes, and take twice as long by public transport as by car
  lead: >
    Drop-offs, pick-ups, and daily shopping, for households with children in Berlin: the mobility
    of care [cite:sanchez2013].
  lines:
    - step: common
      text: More of them than work commutes, and more of them driven.
    - step: slow
      text: Twice as long by public transport as by car.
    - step: distance
      text: They're short, and on half of them the walk alone takes as long as the car.
    - step: whatif
      text: A bus every 10 minutes would speed up only {care.faster|oneIn} of them.
  byline: Isaac Sheets · October 2026
  start: Start
  links:
    - label: Explore the map
      explore: true
    - label: Code
      href: https://github.com/
  map: hero

steps:
  - id: common
    label: How common?
    headline: >
      For [households with children](term:households) in Berlin, [care trips](term:care)
      outnumber [work commutes](term:commutes) and are more car-dependent
    text: >
      Walking and cycling already carry more of them. It's the driven ones,
      {care.car_trips|thousand} a weekday, that public transport could take.
    key: modes
    map: modes

  - id: slow
    label: How much longer?
    headline: >
      Care trips that households currently drive would take twice as long [by public transport](term:timed) as by car
    text: >
      A [study in Norway](term:choice) found that the more [competitive](term:competitive) public
      transport is with the car in terms of time, the more people choose it. In Berlin, it's less competitive for
      care trips than for commutes ([{care.ratio|x}](color:care) against
      [{commute.ratio|x}](color:commute)). The gap is modest, but it holds in most areas.
    key: ratio
    map: ratio

  - id: distance
    label: Why?
    headline: The gap comes from trip length, not worse service for care trips
    text: >
      Care trips are [short](term:short) and commutes long, and public transport is least
      competitive on short trips. At the same distance, the gap is even more modest, so most of it
      is a [composition effect](term:composition).
    key: distance
    map: distance
    view: { band: 0 }

  - id: walking
    label: Why?
    headline: >
      On half of care trips, the [walk to and from stops](term:walk) alone takes as long as the
      whole trip by car
    text: >
      On those trips, public transport can't compete even with no wait and no ride. Commutes are
      longer, so it's true of only a quarter of them.
    key: walking
    map: walking

  - id: whatif
    label: What if?
    headline: >
      The [10-minute goal](term:network) would speed up only {care.faster|oneIn} trips, care trips
      and commutes alike
    text: >
      Those it speeds up save about {care.saved_when_faster|min} minutes. Most change by less than
      a minute.
    key: faster
    map: whatif

  - id: close
    label: So what?
    headline: Closer, not only more often
    text: >
      To compete for care trips, public transport has to come [closer](term:closer) to where they
      start and end.
    map: hero

# Definitions the reader can open from the text: [label](term:id). Keep them to a sentence or
# two; they are the story's fine print. A definition can also be {title, text, head, rows, note}:
# a title in place of the label, a text or a list of paragraphs, a table of rows ([label, value])
# with an optional head, and a note after it.
terms:
  households: >
    The residents of MATSim Open Berlin [cite:matsim], a synthetic population: each lives a real
    respondent's day from Berlin's 2018 travel survey, so together they travel as Berliners do,
    though none is a real person. Here, the adults in households with children, and their trips
    over 500 m with both ends in Berlin.
  care: >
    A trip to or from a drop-off, a pick-up, or daily shopping, by any mode [cite:dianin2026].
    Errands and visits are left out: the data can't tell a household's from a person's own.
  commutes: >
    A trip to or from work with no care destination at either end. Work to a daycare counts as a
    care trip.
  timed: >
    A simulation: each trip driven today, timed again door to door at the hour it was made. By
    public transport on the 2026 timetable [cite:vbb], walking and waiting included; by car, with
    simulated traffic and the time to park [cite:hagen2023] [cite:hubrich2025]. From here on, the
    care trips and commutes are the ones driven today.
  competitive:
    title: Competitiveness
    text: >
      The ratio of public transport's door-to-door travel time to the car's, for the same trip and
      departure time: the closer to 1×, the more competitive.
  choice:
    title: Who chooses public transport
    text: "Among commuters who could drive, in Norwegian cities outside Oslo [cite:lunke2021]:"
    head: [Public transport vs. car, Chose public transport]
    rows:
      - [Under 1.5×, 20% or more]
      - [1.5–2.5×, 15–20%]
      - [2.5–3.5×, 5–15%]
      - [3.5× or more, Under 5%]
  short: >
    A typical care trip is a {care.km|dec1} km drive, a typical commute {commute.km|dec1} km.
  composition:
    title: Composition effect
    text: >
      A gap that comes from the mix of trips, not from how each kind is served. Public transport is
      least competitive on short trips, and half of care trips are under 4 km, so care trips come
      out worse overall. Distance for distance, the two are within about 0.1×.
  walk: >
    From the door to the first stop, between stops when changing, and from the last stop to the
    door, at an adult's pace. With a child or bags of groceries, it's slower.
  network: >
    A bus or tram at least every 10 minutes from 6:00 to 21:00 on every BVG line: a goal of
    Berlin's 2019 local transport plan [cite:nvp], deferred until after 2028. Tested here by
    adding trips wherever a line leaves a longer gap.
  closer: >
    An implication, not a tested scenario. And time is only part of it: escorting people and
    carrying things aren't measured here.

# Each step's key: its control and legend.
keys:
  modes:
    title: Trips over 500 m by mode
    groups: { care: Care trips, commute: Work commutes }
    perWeekday: / weekday
    modes: { pt: Public transport, car: Driving, other: Active and other modes }
    per: 10000
    unit: "Each square: 10,000 trips a weekday. On the map, each dot: {dots.modes|int}."
  ratio:
    title: Where public transport is more competitive, by the median trip from each area
    commuteMore: For commutes
    careMore: For care trips
    even: Even, within 0.1×
    berlin: City-wide
    noData: Too few trips to compare (n < {minimum.statistics|int})
    simulated: >
      Based on a simulation of {trips|thousand} trips by a {scenario.sample|pct} sample of
      residents: {care.trips|thousand} care trips and {commute.trips|thousand} commutes.
  distance:
    title: Share of each group's trips by driving distance
    groups: { care: Care trips, commute: Commutes }
    all: All distances
    km: km
    under: Under
    orMore: or more
    readoutAll: "Median public transport vs. car time, all distances"
    readout: "Median public transport vs. car time,"
    unit: "On the map, each dot: {dots.distance|int} trips a weekday."
  walking:
    title: Trips driven today, timed again by public transport
    groups: { care: Care trips, commute: Commutes }
    perWeekday: / weekday
    categories: { walk_longer: Walk alone outlasts the car, rest: The rest }
    unit: "On the map, each dot: {dots.walk|int} trips a weekday."
  faster:
    title: Trips driven today, timed again by public transport
    groups: { care: Care trips, commute: Commutes }
    perWeekday: / weekday
    categories: { faster: Faster by a minute or more, rest: The rest }
    unit: "On the map, each dot: {dots.faster|int} trips a weekday."

# The tooltip over a planning area.
tooltip:
  carMinutes: 10 min by car
  becomes: become
  byPt: by public transport
  median: Median trip
  trips: { care: care trips, commute: commutes }
  few: Too few trips
  saved: saved per trip, on average
  careTrips: Care trips
  commutes: commutes
  medianRatio: "Median trip, public transport vs. car"

# Where the story hands over: the button that replaces Next on the last step, and explore mode.
explore:
  label: Explore the map
  text: Your area, by hour, by child poverty, and the method in full.
  back: Back to the story
  map: ratio

# For explore mode's 10-minute network card (stage D): cut from the story, kept for there.
network_card:
  coverage: >
    It would put {scenario.covered_10|pct} of Berliners near a line every 10 minutes, up from
    {scenario.covered|pct}, measured as the plan does: living within 400 m of such a stop in dense
    areas, 500 m elsewhere, weekday off-peak.

# For the detailed method view in explore mode (stage D).
method:
  limits:
    - The trips are synthetic.
    - "Only trips driven today are timed: this shows how far public transport is from competing, not how many drivers would switch."
    - Everyone walks at an adult's pace.

ui:
  next: Next
  back: Back
  sources: Sources and data

sources:
  - id: sanchez2013
    text: >
      Sánchez de Madariaga, I. (2013). Mobility of care: Introducing new concepts in urban
      transport. In I. Sánchez de Madariaga & M. Roberts (Eds.), *Fair Shared Cities: The Impact of
      Gender Planning in Europe* (pp. 33–48). Ashgate.
    url: https://www.taylorfrancis.com/chapters/edit/10.4324/9781315581835-4/mobility-care-introducing-new-concepts-urban-transport-in%C3%A9s-s%C3%A1nchez-de-madariaga
  - id: matsim
    text: MATSim Open Berlin scenario, v7.0. Transport Systems Planning and Telematics (VSP), TU Berlin.
    url: https://github.com/matsim-scenarios/matsim-berlin/tree/v7.0
  - id: dianin2026
    text: >
      Dianin, A., Ceccato, R. & Diana, M. (2026). Mobility of care in daily trip chaining: An
      exploratory analysis in Turin, Italy. *Journal of Urban Mobility* 9, 100208.
  - id: vbb
    text: VBB Verkehrsverbund Berlin-Brandenburg. GTFS timetable, published 29 September 2026.
    url: https://unternehmen.vbb.de/digitale-services/datensaetze/
  - id: hagen2023
    text: >
      Hagen, T. & Saki, S. (2023). *start2park – Parksuche erfassen, verstehen und prognostizieren:
      Endergebnisse* (measuring, understanding and predicting the search for parking: final
      results). Frankfurt University of Applied Sciences.
    url: https://fhffm.bsz-bw.de/frontdoor/index/index/docId/6911
  - id: hubrich2025
    text: >
      Hubrich, S., Wittig, S., Ließke, F., Wittwer, R. & Gerike, R. (2025). *Mobilität in Städten –
      SrV 2023* (Berlin's household travel survey): table reports for the inner and outer city.
      TU Dresden.
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsdaten/zahlen-und-fakten/mobilitaet-in-staedten-srv-2023/
  - id: lunke2021
    text: >
      Lunke, E. B., Fearnley, N. & Aarhaug, J. (2021). Public transport competitiveness vs. the
      car: Impact of relative journey time and service attributes. *Research in Transportation
      Economics* 90, 101098.
    url: https://doi.org/10.1016/j.retrec.2021.101098
  - id: nvp
    text: >
      Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt. *Nahverkehrsplan Berlin
      2019–2023*, and the draft *Nahverkehrsplan 2026–2028*.
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/oeffentlicher-personennahverkehr/nahverkehrsplan/

