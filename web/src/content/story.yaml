# Everything the story says, in the order it says it. Edit freely: the page reloads on save.
#
# In any text:
#   {care.ratio|per10}   a number from the data, with a format (see src/lib/text.js for both lists)
#   [cite:lunke2021]     a citation, numbered by first use, opening the Sources drawer
#   **bold**, *italic*, [link text](https://...)
#
# The story is a list of steps. In each, the map tells the finding and the card says how to read
# it: a headline (the claim), one line of text (what to look at, what to try), the step's key (its
# control and legend, src/keys/, worded under `keys`), and details behind "More".
#   label:  the stretch of the story it belongs to (the progress bar, the kicker)
#   map:    a map state (src/map/states.js), drawn for the reader's view
#   view:   where the step's control starts (src/lib/view.svelte.js)
#   demo:   a view the control flips to by itself once, unless the reader gets there first

title: The mobility of care in Berlin

intro:
  kicker: The mobility of care in Berlin
  headline: As common as the commute, twice as long by public transport as by car
  lead: >
    Drop-offs, pick-ups, and daily shopping, for households with children in Berlin: the mobility
    of care [cite:sanchez2013].
  lines:
    - step: common
      text: As common as trips to work, but more often by car.
    - step: slow
      text: Twice as long by public transport as by car.
    - step: distance
      text: They're short, and on a short trip, walking is nearly half the time.
    - step: whatif
      text: A bus every 10 minutes saves under a minute.
  byline: Isaac Sheets · October 2026
  start: Start
  links:
    - label: Explore the map
      explore: true
    - label: Code
      href: https://github.com/
  map: hero

steps:
  - id: common
    label: How common?
    headline: As common as the commute, but more often by car
    text: >
      Trips by adults living with children, by public transport [mark:pt] or by car [mark:car],
      where they start.
    details: >
      Synthetic trips from MATSim Open Berlin [cite:matsim]: simulated residents, each living a
      real respondent's day from the 2018 travel survey. Together they reflect how Berliners
      travel; individually they are stand-ins. A care trip goes to or from a drop-off, a pick-up,
      or daily shopping [cite:dianin2026]; a commute here is any trip to or from work. A care
      destination is at one end of {care.share_of_trips|pct} of their trips, work at one end of
      {work.share_of_trips|pct}, counting every mode. Here, only trips by car (driving or riding)
      and by public transport: walking and cycling are left out. Both ends in Berlin, at least
      500 m apart. The dots are spread over the homes of the planning area where the trips start,
      counted from a 10% sample of them; which dot is which mode is random within an area. Drag
      and zoom the map at any step.
    key: modes
    map: modes

  - id: slow
    label: How slow?
    headline: Twice as long by public transport as by car
    text: >
      Every 10 minutes by car become {care.ratio|per10} by public transport, more in the outer
      districts. The dots [mark:within] are where it's within 1.5× the car.
    details: >
      Each care trip and each commute driven today, timed twice, door to door at the hour it was
      made: by car, with simulated congestion and parking, and by public transport on the 2026
      timetable [cite:vbb], waiting included. From here on, a commute is a drive from home to
      work. At the same distance and from the same district, care trips and commutes fare alike:
      the map shows where people live, not why they travel.
    key: ratio
    map: ratio

  - id: distance
    label: Why?
    headline: Shorter trips, not worse service
    text: >
      Care trips [mark:care] are short, commutes [mark:commute] long. Pick a distance, and the two
      fare the same against the car.
    details: >
      A typical care trip is a {care.km|dec1} km drive, a typical commute {commute.km|dec1} km.
      Every area gets the same number of dots, split between care trips and commutes of that
      distance as they start there.
    key: distance
    map: distance
    demo: { band: 2 }

  - id: trip
    label: Why?
    headline: A typical care trip, half of it walking
    text: From {typical.care.origin} to {typical.care.destination}. The car and the traveler leave together.
    details: >
      One of {typical.care.count|int} typical care trips ({typical.commute.count|int} typical
      commutes): within 5 percentile points of the median on driving distance, ratio, and walking
      share.
    key: race
    map: race

  - id: walking
    label: Why?
    headline: Nearly half of the time is walking
    text: >
      The time care trips would take by public transport, where they start: walking [mark:walk],
      waiting [mark:wait], riding [mark:ride].
    details: >
      Hardest with a child or bags of groceries, and everyone here walks at an adult's pace. All
      the compared trips, by the planning area they start in: every area gets
      {dots.minutes|int} dots per km² of homes, split by its trips' minutes.
    key: minutes
    map: minutes

  - id: whatif
    label: What if?
    headline: A bus or tram every 10 minutes saves under a minute
    text: >
      Care trips on the 10-minute network, where they start. Most are no faster [mark:unchanged];
      few save more than a few minutes.
    details: >
      A goal of Berlin's 2019 local transport plan [cite:nvp], deferred until after 2028; tested
      here anyway, adding trips wherever a bus or tram line of BVG (Berlin's public transport
      operator) leaves a gap longer than 10 minutes between 6:00 and 21:00. A nearby bus becomes
      worth taking, in place of a walk to a farther line. Care trips over 3.5× the car nearly
      halve, from {care.worst|pct1} to {care.worst_10|pct1}.
    key: saved
    map: whatif

  - id: close
    label: So what?
    headline: Closer, not only more often
    text: To compete for care trips, public transport has to come closer to where they start and end.
    details: >
      An implication, not a tested scenario. And time is only part of it: escorting people and
      carrying things aren't measured here.
    key: walk
    map: walkCare

# Each step's key: its control and legend.
keys:
  modes:
    title: Trips by public transport or by car
    groups: { care: Care trips, commute: Commutes }
    perWeekday: / weekday
    modes: { pt: Public transport, car: Car }
    unit: 1 dot = {dots.modes|int} trips
  ratio:
    title: Public transport ÷ car time, median by where trips start
    groups: { care: Care trips, commute: Commutes }
    noData: Fewer than 10 trips
    within: Public transport within 1.5× the car
    of: { care: of care trips, commute: of commutes }
    unit: 1 dot = {dots.within|int} trips a weekday
    lunke: >
      Where public transport takes under 1.5 times as long, it carries 20% or more of commuters
      who could drive; beyond 3.5 times, under 5% [cite:lunke2021].
  distance:
    title: Trips by driving distance, share of each group
    groups: { care: Care trips, commute: Commutes }
    all: All
    km: km
    readoutAll: "Public transport ÷ car, median: all distances"
    readout: "Public transport ÷ car, median:"
  race:
    groups: { care: Care trip, commute: Commute }
    car: By car
    pt: By public transport
    walking: walking
    stages: { walk: Walking, wait: Waiting or parking, ride: Riding, drive: Driving }
    replay: Replay
    another: Another typical trip
  minutes:
    title: Time by public transport
    groups: { care: Care trips, commute: Commutes }
    perTrip: min a trip, on average
    stages: { walk: Walking, wait: Waiting, ride: Riding }
    unit: The same number of dots everywhere; each area's split the way its trips' time is.
  saved:
    title: Minutes saved per trip
    groups: { care: Care trips, commute: Commutes }
    categories: { unchanged: No faster, saved_1: 1–3 min, saved_3: 3–5 min, saved_5: 5 min or more }
    unit: 1 dot = {dots.saved|int} trips a weekday
    lines: "The lines: {scenario.added_trips|int} bus and tram trips added, on {scenario.lines|int} lines"
    mean: >
      On average, **{care.saved|dec1} min** per care trip: {care.saved_walk|dec1} of walking and
      {care.saved_wait|dec1} of waiting saved, {care.ride_longer|dec1} more riding.
  walk:
    walk: The typical care trip's walking legs

# The tooltip over a planning area.
tooltip:
  carMinutes: 10 min by car
  becomes: become
  byPt: by public transport
  median: Median trip
  trips: { care: care trips, commute: commutes }
  few: Fewer than 10 trips
  saved: saved per trip, on average

# Where the story hands over: the button that replaces Next on the last step, and explore mode.
explore:
  label: Explore the map
  text: Your area, by hour, by child poverty, and the method in full.
  back: Back to the story
  map: ratio

# For explore mode's 10-minute network card (stage D): cut from the story, kept for there.
network_card:
  coverage: >
    It would put {scenario.covered_10|pct} of Berliners near a line every 10 minutes, up from
    {scenario.covered|pct}, measured as the plan does: living within 400 m of such a stop in dense
    areas, 500 m elsewhere, weekday off-peak.

# For the detailed method view in explore mode (stage D).
method:
  limits:
    - The trips are synthetic.
    - "Only trips driven today are timed: this shows how far public transport is from competing, not how many drivers would switch."
    - Everyone walks at an adult's pace.

# How the typical trips' ends are described ("a drop-off or pick-up at Wilhelmsaue").
activities:
  transport: a drop-off or pick-up
  home: home
  work: work
  shop_daily: daily shopping
  shop_other: shopping
  leisure: leisure
  work_business: a business appointment
  education: school

ui:
  next: Next
  back: Back
  more: More
  sources: Sources and data

sources:
  - id: sanchez2013
    text: >
      Sánchez de Madariaga, I. (2013). Mobility of care: Introducing new concepts in urban
      transport. In I. Sánchez de Madariaga & M. Roberts (Eds.), *Fair Shared Cities: The Impact of
      Gender Planning in Europe* (pp. 33–48). Ashgate.
    url: https://www.taylorfrancis.com/chapters/edit/10.4324/9781315581835-4/mobility-care-introducing-new-concepts-urban-transport-in%C3%A9s-s%C3%A1nchez-de-madariaga
  - id: matsim
    text: MATSim Open Berlin scenario, v7.0. Transport Systems Planning and Telematics (VSP), TU Berlin.
    url: https://github.com/matsim-scenarios/matsim-berlin/tree/v7.0
  - id: dianin2026
    text: >
      Dianin, A., Ceccato, R. & Diana, M. (2026). Mobility of care in daily trip chaining: An
      exploratory analysis in Turin, Italy. *Journal of Urban Mobility* 9, 100208.
  - id: vbb
    text: VBB Verkehrsverbund Berlin-Brandenburg. GTFS timetable, published 29 September 2026.
    url: https://unternehmen.vbb.de/digitale-services/datensaetze/
  - id: lunke2021
    text: >
      Lunke, E. B., Fearnley, N. & Aarhaug, J. (2021). Public transport competitiveness vs. the
      car: Impact of relative journey time and service attributes. *Research in Transportation
      Economics* 90, 101098.
    url: https://doi.org/10.1016/j.retrec.2021.101098
  - id: nvp
    text: >
      Senatsverwaltung für Mobilität, Verkehr, Klimaschutz und Umwelt. *Nahverkehrsplan Berlin
      2019–2023*, and the draft *Nahverkehrsplan 2026–2028*.
    url: https://www.berlin.de/sen/uvk/mobilitaet-und-verkehr/verkehrsplanung/oeffentlicher-personennahverkehr/nahverkehrsplan/

# The data credits in the Sources drawer: the inputs in summary.json, by these labels, after these lines.
credits:
  extra:
    - "Trips and road travel times: MATSim Open Berlin v7.0, VSP TU Berlin, CC BY 4.0"
  labels:
    vbb: Timetable
    osm-berlin-2026-01-01: Streets
    planning-areas: Planning areas
    child-poverty: Child poverty
    neighbourhoods: Neighborhoods
    inner-city: Inner-city boundary
    population: Population
    otp: Routing (OpenTripPlanner)
